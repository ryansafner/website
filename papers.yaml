- id: usco-2026-characteristics-of-authors
  type: government
  topics: [Creative industries, Intellectual property]
  authors: "U.S. Copyright Office"
  year: 2026
  title: "The Characteristics of Authors Reflected in Copyright Registrations"
  published_url: https://www.copyright.gov/economic-research/characteristics-of-authors/
  abstract: >
    This research note, produced by the U.S. Copyright Office’s Office of the Chief Economist, 
    examines socioeconomic patterns of authors who register copyrights. It is based on copyright 
    registrations submitted by individuals (as compared to corporate or other organizational claimants) 
    between 2011 and 2024,1 which have been aggregated by zip code, year, and type of creative work. 
    Statistical analyses of these data produce the following key findings: More copyright registrations 
    originate from areas where people have higher levels of educational attainment, earn higher incomes, 
    are older, and work in the information and entertainment industries. More copyright registrations 
    per person originate from urban areas than rural or suburban ones, suggesting certain productive 
    efficiency gains from agglomeration (the tendency for economic activity to cluster geographically).
    The relationship between copyright registrations and socioeconomic characteristics varies 
    substantially for different types of creative works.

- id: lutes-2025-economic-implications-of-ai
  type: government
  topics: [Artificial intelligence, Intellectual property, Creative industries]
  authors: "Lutes, Brent (Ed.)"
  year: 2025
  title: "Identifying the Economic Implications of Artificial Intelligence for Copyright Policy: Context and Direction for Economic Research"
  published_url: https://www.copyright.gov/economic-research/economic-implications-of-ai/
  abstract: > 
    The Copyright Office released Identifying the Economic Implications of Artificial Intelligence 
    for Copyright Policy, produced by a group of economic scholars discussing the economic issues 
    at the intersection of artificial intelligence and copyright policy. The group engaged in 
    several months of substantive discussions, consultation with technical experts, and research, 
    culminating in a daylong roundtable event. The group’s goal was identifying the most 
    consequential economic characteristics of AI and copyright and what factors may inform policy 
    decisions. The roundtable discussion aimed to provide a structured and rigorous framework for 
    considering economic evidence so that the broader economic research community can effectively 
    answer specific questions and identify optimal policy choices. This publication serves as a 
    platform for articulating the ideas expressed by participants as part of the roundtable. All 
    principal contributors submitted written materials summarizing the group’s prior discussions 
    on a particular topic, with editorial support provided by the Office of the Chief Economist. 
    The many ideas and views discussed in this project do not necessarily represent the views of 
    every roundtable participant or their respective institutions. The Copyright Office does not 
    take a position on these ideas for the purposes of this project. 

- id: usco-2024-geography
  type: government
  topics: [Creative industries, Intellectual property]
  authors: "U.S. Copyright Office"
  year: 2024
  title: "The Geography of Copyright Registrations"
  published_url: https://copyright.gov/economic-research/geography/
  abstract: >
    The U.S. Copyright Office has released a report, The Geography of Copyright Registrations. 
    The study examines the geographic distribution of copyright claims registered by individuals 
    and organizations within the United States. The purpose of the report is to better understand 
    where the copyright system is used and how patterns of registrations differ across areas 
    within the country. The report reveals: The majority of copyright registrations originate 
    from a handful of large metropolitan areas. Approximately 40 percent of all copyright 
    registrations originate from just five: New York, Los Angeles, Philadelphia, Washington, 
    DC, and Chicago. Within the United States, certain geographic areas specialize in different 
    types of creative works. For example, registrants in the South register many copyrights for 
    musical works, registrants in the Northeast and Mid-Atlantic states register many literary 
    works, and registrants in California specialize in film and dramatic works.
    Some areas have a high volume of registrations simply because of their large populations. 
    When controlling for population, numerous locations at the city level emerge where 
    individuals, companies, or universities are registering high concentrations of creative works. 
    This report uses data from copyright claims registered between 2009 and 2022. A forthcoming 
    report will focus on the demographics of copyright registrations in the United States. 

- id: usco-2024-resilience-of-creativity
  type: government
  topics: [Creative industries, Intellectual property]
  authors: "U.S. Copyright Office"
  year: 2024
  title: "The Resilience of Creativity: An Examination of the COVID-19 Impact on Copyright-Reliant Industries and Their Subsequent Recovery"
  published_url: https://copyright.gov/economic-research/resilience-of-creativity/
  abstract: >
    The U.S. Copyright Office has released The Resilience of Creativity: An Examination of 
    the COVID-19 Impact on Copyright-Reliant Industries and Their Subsequent Recovery. The 
    study examines the impact and subsequent recovery from the COVID-19 pandemic in terms 
    of employment, revenues, and creative outputs in copyright-reliant industries. It uses 
    data from the Bureau of Labor Statistics, U.S. Census, and U.S. Copyright Office 
    pertaining to eighteen industries that produce the types of works registered with 
    the U.S. Copyright Office. The report reveals: As a whole, copyright-reliant industries 
    experienced a substantial downturn resulting from the COVID-19 pandemic, but the effect 
    was decidedly smaller than that on the broader U.S. economy. Copyright-reliant 
    industries, as a whole, recovered from the pandemic-induced downturn substantially 
    quicker than the broader U.S. economy. The pandemic impact on employees was 
    substantially larger than the impact on copyright-reliant firms (which is consistent 
    with the experience of non-copyright reliant industries). The pandemic effects were 
    significantly varied among industries.


