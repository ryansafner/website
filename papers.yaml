- id: gangotena-safner-increasing-returns
  type: wip
  topics: [Innovation and growth, Institutions and governance]
  authors: "[Santiago Gangotena](https://www.usfq.edu.ec/es/perfiles/santiago-jose-gangotena-ruiz)"
  title: "The Production of Increasing Returns: Physical Technology, Institutional Technology, and the Pitfalls of Production Functions"
  abstract: >
    Economists often model the delicate relationship between production, innovation, and economic
    growth as a production function that exhibits increasing returns to scale (IRS). The existence of 
    knowldge spillovers or learning by doing implies conclusions about the optimal use of protectionist trade and 
    industrial policies that increase national welfare by reallocating productive resources in order to exploit IRS. 
    We claim that all physical technologies, understood as recipes that produce a specified output from given inputs, 
    exhibit constant returns to scale. Increasing returns to scale comes from institutions that enable entrepreneurial 
    discovery and choice to switch between physical technologies. We examine several case studies of apparently successful 
    infant industries and clarify the nature and economic relationships behind the phenomena of increasing returns and 
    the limitations of existing models of production, we contribute a new understanding of research with applications 
    to innovation, economic growth, and trade policy.

- id: gangotena-safner-two-capitals
  type: wip
  topics: [Innovation and growth]
  authors: "[Santiago Gangotena](https://www.usfq.edu.ec/es/perfiles/santiago-jose-gangotena-ruiz)"
  title: "A Tale of Two Capitals: Modeling the Interaction between Ideas, Physical Capital, and Growth"
  abstract: >
    This paper models the relationship between innovation and sustained economic growth through as being mediated by 
    institutions that calibrate a ‘structure of technological production’ analogous to capital-based models of the 
    structure of production. Our framework discusses two types of capital: physical capital and ethereal capital 
    (productivity-enhancing ideas). We cast these two structures in a network, the structure of which is determined 
    by the institutions of a society. Predictions derived from this model may resolve some puzzles in the history 
    of economic growth, such as ancient inventions ‘far ahead of their time’ failing to stimulate sustained growth, 
    the phenomena of simultaneous independent invention, and failures of technology transfers.

