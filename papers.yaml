- id: palmedo-lutes-safner-2026-ai-skill-demand
  type: article
  topics: [Artificial intelligence, Creative industries]
  authors: "Palmedo, Michael, Brent Lutes, and **Ryan Safner**"
  year: 2026
  title: "AI Skill Demand and Employment Stratification in Copyright-Intensive Information Industries: Evidence from Job Postings and Industry-Level Employment Data"
  journal: "Work and Occupations"
  issue: "53(3): 707-744"
  published_url: https://doi.org/10.1177/07308884261447535
  abstract: >
    This paper examines how employer demand for workers skilled in the use of
    artificial intelligence (AI) is associated with employment patterns in
    copyright-intensive industries within the U.S. information sector. Using
    panel data from the Census Bureau's Quarterly Workforce Indicators combined
    with data on AI-related job postings, we analyze how the relationship
    between employer demand for AI skills and employment levels varies across
    worker groups between 2018 and 2024. Furthermore, we document changes in
    this relationship following the widespread introduction of generative AI in
    late 2022. We find that employment in copyright-reliant information
    industries declined relative to other industries after late 2022, and that
    the association between AI-related job postings and employment is highly
    heterogeneous. Initial findings indicate that employment relationships were
    negative or statistically insignificant for workers who had not completed a
    four-year college degree, for women, and for the youngest and oldest age
    cohorts. A positive relationship existed for college educated workers, men,
    and prime-age workers, though this weakened in the periods after the
    introduction of generative AI. These findings provide early insights into
    how demand for generative AI skills may reshape labor market stratification
    within creative and information-intensive industries and underscore the
    importance of examining technological change in future research.

- id: safner-2025-most-interesting-economist
  type: article
  topics: [Teaching]
  authors: "**Safner, Ryan**"
  year: 2025
  title: "The Most Interesting Economist in History: Using an NCAA-Style Tournament Assignment to Teach the History of Economic Thought"
  journal: "Journal of Economics Teaching"
  issue: "10: 1-19"
  published_url: http://downloads.journalofeconomicsteaching.org/2024/2024-19.pdf
  abstract: >
    I describe an assignment for a history of economic thought (HET) course,
    "The Most Interesting Economist in History," modeled on the National
    Collegiate Athletic Association (NCAA) College Basketball Tournament.
    Economic thinkers are paired in head-to-head matchups for each era and
    students vote for those they find to be more "interesting" and must explain
    the reasoning behind their votes. This assignment promotes active learning
    and is a more engaging way to juggle complex themes with a large list of
    thinkers over a semester-long seminar.

- id: safner-2023-honor-among-thieves
  type: article
  topics: [Intellectual property, Economic history, Institutions and governance]
  authors: "**Safner, Ryan**"
  year: 2023
  title: "Honor Among Thieves: How 19th Century American Pirate Publishers Simulated Copyright Protection"
  journal: "Economics of Governance"
  issue: "24: 119-141"
  published_url: https://doi.org/10.1007/s10101-023-00289-2
  abstract: >
    From 1790 to 1891, the United States prevented foreign authors from obtaining 
    domestic copyright protection, implicitly subsidizing a domestic reprinting industry. 
    With foreign works a “free” and unprotected resource, American publishers created a system of 
    voluntary norms, known as “trade courtesy” to create and enforce pseudo-property rights in 
    uncopyrighted foreign works, simulating the effects of legal copyright protection. 
    This paper analyzes this system using the Bloomington School’s institutional design 
    principles to understand its effectiveness and pitfalls in managing the commons of 
    unprotected foreign works in 19th Century America.

- id: tarko-safner-2022-regulatory-diversity
  type: article
  topics: [Political economy]
  authors: "[Tarko, Vlad](https://vladtarko.com/) and **Ryan Safner**"
  year: 2022
  title: "International Regulatory Diversity Over 50 Years: Political Entrepreneurship within Fiscal Constraints"
  journal: "Public Choice"
  issue: "193(1-2): 79-108"
  published_url: https://doi.org/10.1007/s11127-022-01011-2
  abstract: >
    Over the last 50 years, economic freedom in modern capitalist democracies has increased although 
    the regulatory state has expanded considerably, resulting in the paradox of “freer markets, 
    more rules” (Vogel, 1996). We provide a hierarchical cluster analysis of the policy trajectories 
    of OECD countries over the last 50 years, as well as a theoretical framework that builds on 
    Stigler’s (1971) theory of economic regulation. Our findings suggest that these developments 
    are not the result of ideological narratives such as “neoliberalism,” but instead we confirm 
    some claims from the “varieties of capitalism” and “regulatory capitalism” literatures using 
    independent methods. Our approach is better able to explain the diversity of regulatory regimes 
    across countries than existing approaches that focus on either national patterns or policy sectors, 
    and we also provide a fuller account of government crowding-out and crowding-in effects across the 
    entire structure of production.

- id: safner-2021-public-good
  type: article
  topics: [Political economy]
  authors: "**Safner, Ryan**"
  year: 2021
  title: "'Public Good,' or 'Good for the Public?' Political Entrepreneurship and the Public Funding of Scientific Research"
  journal: "Journal of Private Enterprise"
  issue: "36(1): 743-771"
  published_url: http://journal.apee.org/index.php/2021_Journal_of_Private_Enterprise_Vol_36_No_1_Spring_parte2
  abstract: >
    Public goods are traditionally classified according to an exogenous, technological definition of 
    possessing the characteristics of nonrivalry and nonexcludability. This paper takes a more 
    endogenous approach, where goods are defined by the political purposes that specific actors 
    have regarding these goods, and emerge through political entrepreneurship. I use government 
    sponsorship of basic scientific research as a case study. Proponents argue that scientific 
    research constitutes a public good requiring government assistance, but in fact, government 
    provision of science is endogenous, and better explained by the political entrepreneurship 
    involved in convincing the public of the superiority of political over private provision.

- id: safner-2016-wikipedia
  type: article
  topics: [Intellectual property, Institutions and governance]
  authors: "**Safner, Ryan**"
  year: 2016
  title: "Institutional Entrepreneurship, Wikipedia, and the Opportunity of the Commons"
  journal: "Journal of Institutional Economics"
  issue: "12(4): 743-771"
  published_url: https://doi.org/10.1017/S1744137416000096
  abstract: >
    Copyright laws traditionally attempt to incentivize expression and minimize
    free rider problems through legal restrictions, at the expense of closing
    off access to cultural history. However, entrepreneurial changes to
    institutions and the creation of alternative governance structures can
    allow for spaces that facilitate expression without resorting to the
    copyright approach. Wikipedia, the free online encyclopedia, stands as a
    highly visible example of such institutional entrepreneurship, leveraging
    copyright law *against* its intended purpose. This paper uses the
    Bloomington School's IAD framework to explain the success of Wikipedia's
    alternative model of managing a common resource of free encyclopedia
    articles, and suggests a roadmap for understanding the role of
    institutional entrepreneurship in crafting alternative governance
    structures to foster expression.

- id: safner-2016-perils-of-copyright
  type: article
  topics: [Intellectual property, Political economy]
  authors: "**Safner, Ryan**"
  year: 2016
  title: "The Perils of Copyright Regulation"
  journal: "Review of Austrian Economics"
  issue: "29(2): 121-137"
  published_url: https://doi.org/10.1007/s11138-014-0293-5
  abstract: >
    The most robust framework for understanding the evolution and consequences of 
    copyright statutes in the United States is the dynamics of interventionism. I 
    apply the framework of Kirzner’s (1985) perils of regulation to the general revision of 
    copyright law in 1976, and explore its effects on entrepreneurship and discovery processes. 
    Critics of copyright commonly recognize the distortions of rent-seeking, but I emphasize 
    the utility of interventionism to explain the“unsimulated” and the “stifled” discovery 
    processes set in motion by copyright interventions, which use legal processes to 
    allocate resources, and deter future discovery by raising transaction costs.

